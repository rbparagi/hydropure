<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex,nofollow"><title>One Street</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap">
<style>
:root{--d:"Cormorant",Georgia,serif;--b:"Outfit",system-ui,sans-serif;--gold:#f0cf86;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:#060c18;color:#eef4fb;font:400 17px/1.5 var(--b);-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.6s}.ready #gl{opacity:1}
.scrim{position:fixed;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(4,8,18,.92) 0,rgba(4,8,18,.62) 17%,transparent 36%),linear-gradient(90deg,rgba(4,8,18,.5),transparent 42%),radial-gradient(120% 90% at 50% 42%,transparent 58%,rgba(3,6,14,.6))}
.cap{position:fixed;left:max(28px,5vw);bottom:max(40px,6.4vh);width:min(760px,calc(100vw - 360px));pointer-events:none}
.cap>*{transition:opacity .34s,transform .5s cubic-bezier(.2,.7,.2,1)}.cap.o>*{opacity:0;transform:translateY(14px)}.cap>*:nth-child(2){transition-delay:.07s}.cap>*:nth-child(3){transition-delay:.14s}
.cap b{display:block;font:500 clamp(3rem,6.4vw,5.6rem)/.95 var(--d);color:var(--gold);font-variant-numeric:lining-nums;margin-bottom:12px;white-space:nowrap}.cap b:empty{display:none}
.cap h1{font:500 clamp(2rem,3.9vw,3.4rem)/1.06 var(--d);letter-spacing:-.015em;text-wrap:balance;text-shadow:0 2px 30px rgba(3,6,14,.8);font-variant-numeric:lining-nums}
.cap p{margin-top:14px;font-size:clamp(1.06rem,1.5vw,1.28rem);color:#cfdbea;max-width:44em;text-wrap:pretty;text-shadow:0 1px 16px rgba(3,6,14,.9)}.cap p:empty{display:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}:focus-visible{outline:2px solid #7fb0ff;outline-offset:3px;border-radius:8px}
.ctl{position:fixed;right:max(28px,5vw);bottom:max(40px,6.4vh);display:flex;gap:10px;align-items:center}.ctl .nx{min-width:132px;padding:16px 30px;border-radius:40px;background:#fff;color:#0a1424;font-weight:600;font-size:1.06rem;transition:transform .25s}.ctl .nx:hover{transform:translateY(-2px)}.ctl .bk{width:52px;height:52px;border-radius:50%;border:1px solid rgba(190,215,250,.3);display:grid;place-items:center}.ctl .bk:disabled{opacity:.3;cursor:default}.ctl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{position:fixed;left:max(28px,5vw);right:max(28px,5vw);top:max(22px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:20px}.logo{font:600 1.4rem var(--d)}.logo span{color:#6aa9ff}
.sc{display:flex;gap:8px;align-items:center}.mid{text-align:center}.mid span{display:block;margin-top:9px;font-size:.88rem;color:#a9bad1}.sc{justify-content:center}.sc i{width:30px;height:3px;border-radius:3px;background:rgba(190,215,250,.22);overflow:hidden}.sc i::after{content:"";display:block;height:100%;background:#fff;transform:scaleX(var(--f,0));transform-origin:left;transition:transform .6s}
.tl{display:flex;gap:6px}.tl button{white-space:nowrap;padding:9px 14px;border-radius:30px;font-size:.92rem;color:#c3d1e3}.tl button:hover{background:rgba(255,255,255,.1);color:#fff}
.tag{position:fixed;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .5s;will-change:transform}.tag.on{opacity:1}.tag span{position:absolute;transform:translate(-50%,-100%);padding:5px 13px;border-radius:30px;background:rgba(5,10,22,.66);border:1px solid rgba(255,255,255,.16);white-space:nowrap;font-size:.95rem;font-weight:500;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.tag span small{font-weight:400;color:#b7c6da;font-size:.88rem;margin-left:6px}
.tag.tk span{transform:translate(calc(-100% - 24px),-50%);background:rgba(5,10,22,.62);border-radius:16px;text-align:left;padding:11px 18px;font:500 clamp(1.7rem,2.6vw,2.5rem)/1 var(--d);font-variant-numeric:lining-nums;text-shadow:0 2px 16px rgba(3,6,14,.95)}.tag.tk small{display:block;font:400 .95rem var(--b);margin:5px 0 0;color:#c9d7ea}
.nm{position:fixed;right:max(28px,5vw);top:50%;transform:translate(30px,-56%);width:300px;display:grid;gap:9px;opacity:0;pointer-events:none;transition:opacity .5s,transform .6s}.nm.on{opacity:1;pointer-events:auto;transform:translate(0,-56%)}.nm p{font-size:.88rem;color:#b7c6da}.nm input{font:400 1.06rem var(--b);color:#fff;background:rgba(5,10,22,.72);border:1px solid rgba(190,215,250,.28);border-radius:14px;padding:13px 16px;outline:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.nm input:focus{border-color:var(--gold)}.nm input::placeholder{color:#8fa0b6}.nm b{font:500 1.35rem/1.25 var(--d);color:var(--gold);margin-top:8px;min-height:2.6em;font-variant-numeric:lining-nums;text-shadow:0 1px 14px #030610}
.nm input,#nstep,#ncalc{display:none}.m1 input{display:block}.m2 #nstep,.m3 #ncalc{display:grid;gap:8px}.nm.m3{width:400px}
#nstep div{display:grid;grid-template-columns:minmax(0,1fr) 46px 30px 46px;align-items:center;gap:6px;background:rgba(5,10,22,.74);border:1px solid rgba(190,215,250,.2);border-radius:14px;padding:6px 8px 6px 16px}#nstep span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#nstep b{font-variant-numeric:lining-nums;margin:0;min-height:0;text-align:center;color:#fff;font-size:1.5rem}#nstep button{height:44px;border-radius:12px;background:rgba(255,255,255,.1);font-size:1.4rem;line-height:1}#nstep button:hover{background:rgba(255,255,255,.2)}#nstep button:disabled{opacity:.25;cursor:default}
#ncalc{gap:0!important;background:rgba(5,10,22,.8);border:1px solid rgba(190,215,250,.18);border-radius:18px;padding:10px 20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}#ncalc div{display:grid;grid-template-columns:minmax(0,1fr) auto 92px;gap:12px;align-items:baseline;padding:7px 0;font-variant-numeric:tabular-nums}#ncalc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#ncalc i{font-style:normal;font-size:.86rem;color:#8fa0b6}#ncalc b{margin:0;min-height:0;font:500 1rem var(--b);color:#fff;text-align:right}#ncalc .k span{color:#b7cbea}#ncalc .t{border-top:1px solid rgba(190,215,250,.3);margin-top:6px;padding-top:11px}#ncalc .t b{font:500 1.35rem/1 var(--d);font-variant-numeric:lining-nums;color:var(--gold)}#ncalc .u{color:#8fa0b6}#ncalc .u b{color:#b7c6da}
.det2{position:fixed;right:max(28px,5vw);bottom:calc(max(40px,6.4vh) + 74px);display:flex;gap:10px;opacity:0;visibility:hidden;transition:opacity .4s}.det2>*{flex:1;text-align:center;white-space:nowrap;padding:14px 24px;border-radius:40px;border:1px solid rgba(255,255,255,.4);background:rgba(5,10,22,.5);color:inherit;text-decoration:none}.last .det2{opacity:1;visibility:visible}
.hand{position:fixed;inset:0;z-index:20;background:#070e1d;overflow:auto;opacity:0;pointer-events:none;transition:opacity .35s;padding:90px max(24px,calc((100vw - 820px)/2)) 80px}.hand.on{opacity:1;pointer-events:auto}#hx{position:fixed;right:max(24px,4vw);top:24px;padding:11px 22px;border-radius:30px;background:#fff;color:#0a1424;font-weight:600;z-index:2}.hand h2{font:500 clamp(2.6rem,5vw,4rem)/1 var(--d)}.hl{color:#b9c7d9;font-size:1.15rem;margin-top:14px}.hand h3{font:500 1.8rem/1.1 var(--d);margin:52px 0 12px}.hand p{color:#c6d3e4;max-width:68ch}.hand a{color:#fff;border-bottom:1px solid #50658a;text-decoration:none}.ht{overflow-x:auto;margin-top:16px}.hand table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:460px}.hand th{text-align:right;font-weight:500;color:#8fa0b6;font-size:.9rem;padding:10px 8px}.hand td{text-align:right;padding:12px 8px;border-top:1px solid rgba(160,192,235,.16)}.hand th:first-child,.hand td:first-child{text-align:left}.hand details{border-top:1px solid rgba(160,192,235,.16)}.hand summary{cursor:pointer;padding:17px 0;font-weight:500}.hand details p{padding-bottom:20px}.hs{font-size:.9rem;margin-top:52px;color:#8fa0b6!important}
.load{position:fixed;inset:0;display:grid;place-items:center;background:#060c18;transition:opacity 1.2s;pointer-events:none;font:500 1.6rem var(--d);color:#9fb3cf}.ready .load{opacity:0}
.nogl{background:linear-gradient(180deg,#0b1730,#060c18)}
@media(max-width:800px){.tag.tk span{transform:translate(-50%,-100%);text-align:center;padding:7px 14px;font-size:1.4rem}.tag small{display:none}.tag.tk small{display:block;font-size:.8rem;margin-top:2px}.cap{left:22px;right:22px;width:auto;bottom:116px}.cap h1{font-size:1.9rem}.cap p{font-size:1.04rem;margin-top:9px}.cap b{font-size:3rem;margin-bottom:8px}.ctl{left:22px;right:22px;bottom:34px}.ctl .nx{flex:1}.top{left:22px;right:22px}.tl button:not(#det){display:none}.top{gap:10px}.logo{font-size:1.25rem}.sc{gap:3px}.sc i{width:12px}.tl button{padding:8px 2px}.mid span{display:none}.nm{right:22px;left:22px;width:auto;top:84px;transform:none!important;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}.nm input{min-width:0;width:100%}.nm>p{grid-column:1/-1}.nm input{padding:9px 13px;font-size:16px}.nm>b{grid-column:1/-1;font-size:1.15rem}.det2{left:22px;right:22px;bottom:100px}.det2>*{padding:11px 8px}.last .cap{bottom:164px}.scrim{background:linear-gradient(0deg,rgba(4,8,18,.96) 0,rgba(4,8,18,.82) 30%,transparent 56%)}.tag span{font-size:.82rem;padding:3px 10px}}
@media(max-width:900px){.nm{right:22px;left:22px;width:auto;top:84px;transform:none!important;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}.nm.m3{width:auto}.nm>p,.nm>b,#nstep,#ncalc{grid-column:1/-1}#nstep{grid-template-columns:repeat(2,minmax(0,1fr))}#nstep div{grid-template-columns:minmax(0,1fr) 34px 20px 34px;padding:4px 5px 4px 10px;gap:3px}#nstep button{height:38px}#ncalc{padding:6px 14px}#ncalc div{padding:3px 0;font-size:.92rem}.nm input{min-width:0;width:100%}#full,#snd{display:none}}
@media(max-height:560px) and (min-width:801px){.cap h1{font-size:1.9rem}.cap b{font-size:2.8rem}.cap p{font-size:1rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<canvas id="gl" role="img" aria-label="A street at dusk. Houses light up as machines are sold, and a glass tank on your roof fills with water."></canvas><div class="scrim"></div>
<div id="tags"></div>
<div class="top"><div class="logo">Hydro<span>Pure</span></div><div class="mid"><div class="sc" id="sc" aria-hidden="true"></div><span id="sname"></span></div><div class="tl"><button id="snd" aria-pressed="false">Sound off</button><button id="det">Details</button><button id="notes" hidden title="Speaker notes (S)">Speaker notes</button><button id="full" title="Full screen (F)">Full screen</button></div></div>

<div class="det2"><button id="det2">Read the details</button><a href="../estimator/">Try the estimator</a></div>
<div class="hand" id="hand" role="dialog" aria-label="The details"><button id="hx" aria-label="Close">Close</button><div id="hbody"></div></div>
<div class="load">One street</div>

  { scene: 'Why I am telling you this', h: 'This is our home.', p: 'I like to know how a thing works before I trust it. That is my job.', say: '' },
  { h: 'We bought the machine for our family first.', p: 'There was no business in our minds that day.', say: '' },
  { h: 'Later, I asked one question. How does the money work?', p: 'Let me show you what I found.', say: '' },

  { scene: 'Your house', h: 'Now look at this house. It is yours.', p: '', say: '' },
  { h: 'You bring one machine home.', n: N.price, p: 'The price of an SD501 DX.', say: '' },
  { h: 'Look up. There is a tank on your roof.', p: `It is empty. When it fills to ${N.price}, your machine has paid for itself.`, say: '' },

  { scene: 'Your neighbour', h: 'Your neighbour Ramesh comes over and tastes the water.', p: '', say: '' },
  { h: 'He wants one in his home too.', p: 'He buys his own machine. His house lights up.', say: '' },

  { h: 'Your colleague Suresh buys. Now two drops are yours.', n: '+ ' + N.two, p: 'From your third sale you earn double. See how the pipe got wider?', say: '' },

  { h: "Then three of Lakshmi's friends.", n: N.three1, p: 'You did not make these sales. One drop from each is yours.', say: '' },
  { h: "And three of Suresh's friends.", n: N.three2, p: 'Remember his wider pipe? Two drops come from every house in his line.', say: '' },
  { h: `Twelve houses. ${N.t12} in your tank.`, p: `Some people call the machine free at this point. It is not. ${N.t12left} is still to come.`, say: '' },

  { scene: 'The tank fills', h: 'Twelve houses have earned you a wider pipe.', p: `Once your group passes ${N.u3} sales, your own next sale pays three drops.`, say: '' },
  { h: 'Your friend Anita buys.', n: '+ ' + N.triple, p: 'Three drops, from one sale.', say: '' },
  { h: 'Then Deepak.', n: '+ ' + N.triple, p: 'Three drops again.', say: '' },
  { h: 'Your tank is full.', n: N.t14, p: 'Fourteen houses: five sales of yours, nine by your team. The machine has paid for itself, before tax and other costs.', say: '' },

  { scene: 'A wider pipe', h: 'What happens after that?', p: 'Every sale still pours eight drops. What grows is how many your pipe can carry.', say: '' },
  { h: `${N.u4} houses in your group. Four drops.`, n: N.r4, p: 'From your own next sale.', say: '' },
  { h: `${N.u5} houses. Five drops.`, n: N.r5, p: 'From your own next sale.', say: '' },
  { h: `${N.u6} houses. Six drops. This is called 6A.`, n: N.r6, p: 'It is as wide as the pipe gets. And a hundred houses is a lot of houses.', say: '' },

  { scene: 'Too far away', h: 'Some sales now happen very far from you.', p: 'Eight people stand in between. Each takes a drop, and none is left when it reaches your house.', say: '' },
  { h: 'So a 6A is paid a flat amount instead.', n: N.edu, p: 'For each house too far for the eight drops. It is called the education bonus.', say: '' },
  { h: 'Here is one example for a 6A.', n: N.s6, p: `${N.sn} far houses, ${N.sedu}. One sale of your own, ${N.r6}. A group bonus of about ${N.sgrp}. An example, not a typical result.`, say: '' },
  { h: 'Then others light up streets of their own.', p: 'When two people in your team reach 6A, you become a 6A2. Every title after that needs two people at the one before.', say: '' },
  { h: 'For the title 6A2-3, you need at least eight of them.', n: N.lead3, p: 'A month, at the rate used in the plan. Eight people at 6A, each with a group of a hundred houses behind them.', say: '' },

  { h: 'So buy it for the water first.', p: 'If you would want it at home with no business at all, you are starting from the right place.', say: '' },

  { h: 'Your own calculation.', p: 'Before tax, travel and filters. Only if every one of these people really buys.', say: '' },
  { h: 'Start with a glass of water, not a decision.', p: CONTACT, end: 1, say: '' }
];

  <h3>Who gets the eight points</h3><p>As we read the plan, the seller is paid first. Then each person above takes what their line allows, from what is left, until the eight are used. Enagic's official plan decides the actual payment.</p>

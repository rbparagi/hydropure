<body class="intro">
<canvas id="gl" role="img" aria-label="A street at dusk. Houses light up as machines are sold, and a glass tank on your roof fills with water."></canvas><div class="scrim"></div>
<div class="veilx"></div><div id="tags"></div>
<div class="top"><div class="logo">Hydro<span>Pure</span></div><div class="mid"><div class="sc" id="sc" aria-hidden="true"></div><span id="sname"></span></div><div class="tl"><button id="play" aria-pressed="false" title="Play or pause (P)">Play</button><button id="snd" aria-pressed="false">Sound off</button><button id="det">Details</button><button id="notes" hidden title="Speaker notes (S)">Speaker notes</button><button id="full" title="Full screen (F)">Full screen</button></div></div>
<div class="cap" id="cap" aria-live="polite"><b></b><h1></h1><p></p></div>
<div class="ctl"><button class="bk" id="bk" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="nx" id="nx">Next</button></div>
<div class="doors" id="doors" role="group" aria-label="Which reason is yours?"><button class="dw" data-door="water" aria-pressed="false"><i></i><b>For the water</b><span>I want it at home</span></button><button class="df" data-door="future" aria-pressed="false"><i></i><b>For the future</b><span>I want a business</span></button></div>
<div class="ladder" id="ladder" aria-label="What one sale of your own pays on each line"></div>
<div class="nm gp" id="gp"><div id="g1"><p id="ghint"></p><div id="gch" role="group" aria-label="Your goals"></div><div id="gam"></div></div><div id="g2"><div id="gneed"></div></div></div>
<div class="nm" id="names"><p id="nhint">Nothing you type is saved or sent.</p><input maxlength="18" placeholder="First name" aria-label="First person" autocomplete="off"><input maxlength="18" placeholder="Second name" aria-label="Second person" autocomplete="off"><input maxlength="18" placeholder="Third name" aria-label="Third person" autocomplete="off"><input maxlength="18" placeholder="Fourth name" aria-label="Fourth person" autocomplete="off"><input maxlength="18" placeholder="Fifth name" aria-label="Fifth person" autocomplete="off"><div id="nstep"></div><div id="ncalc"></div><b id="nout" aria-live="polite"></b></div>
<div class="det2"><button id="det2">Read the details</button><a href="../estimator/">Try the estimator</a></div>

  <h3>Leadership titles</h3><p>Each title needs two people, in separate branches, at the title just below. The plan prints these in dollars; they are shown in rupees at the plan's own rate of about \u20B9${Math.round(PLAN.rupeesPerDollar)}. What Enagic India pays may differ.</p>${n(["Title","6A leaders below you","One-time bonus","Monthly amount"],PLAN.titles.map((r,a)=>[r.name,a?2**a:"none",t(r.bonus),r.monthly?t(r.monthly):"none"]))}
  <h3>What people actually earn</h3><p>We found no official earnings figures for India, so ask Enagic India for them. Enagic's own US figures for 2024 put ${PLAN.official.share}% of distributors at 1A or 2A. The typical 1A earned about ${N.med} in the whole year, before expenses. Source: <a href="https://www.enagic.com/en/distributors-earnings-disclosure-statement" target="_blank" rel="noopener">Enagic USA Earnings Disclosure Statement</a>, updated 19 May 2025, converted to rupees at the plan's rate. Enagic says no income is promised or guaranteed.</p>
  <h3>Questions worth asking</h3>${[["Can I buy it only as a business?","Yes, if you treat it as one. You pay the full price first, it takes sales by you and your team to recover it, and many people do not get that far."],["Is this multi-level marketing?","It works on several levels, so yes, in that sense. Commission is paid when a machine is sold. Signing someone up, with no machine sold, should pay nothing."],["Can I lose money?","Yes. If you buy a machine mainly for the business and don't sell enough, you won't recover its price. Travel, events and tax come out of your earnings too."],["Is the machine free after 12 sales?",`No. In the story, three sales of yours and nine by your team bring ${N.t12}. That is ${N.t12left} short of the price.`],["Can my rank drop, or do I pay to renew?","The 2026 plan says ranks don't go down and there is no annual renewal. Check both in the distributor agreement, and ask whether you must keep making your own sales."],["How long does a machine last?","Some presentations divide the price over 25 years. HydroPure lists a five-year warranty on the SD501 DX, so plan on that. Filters are extra."],["Will it cure anything?","No. It's water. Let people taste it, see the tests and decide."]].map(r=>`<details><summary>${r[0]}</summary><p>${r[1]}</p></details>`).join("")}
